<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Anzala Chikankari</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="headerMount"></div>

<section class="section container">
  <h1 class="section-title" id="pageTitle" style="font-size:34px;">Shop All</h1>
  <div class="products-toolbar">
    <div class="filters" id="categoryChips"></div>
    <div class="filters">
      <input type="number" id="minPrice" placeholder="Min ₹" style="width:90px">
      <input type="number" id="maxPrice" placeholder="Max ₹" style="width:90px">
      <select id="sortSelect">
        <option value="">Sort: Featured</option>
        <option value="newest">Newest</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="rating">Top Rated</option>
      </select>
    </div>
  </div>
  <div class="product-grid" id="productGrid"></div>
</section>

<div id="footerMount"></div>
<script src="/js/app.js"></script>
<script>
let categories = [];
async function init() {
  await mountChrome('shop');
  categories = await api.get('/categories');
  renderChips();
  document.getElementById('minPrice').addEventListener('change', load);
  document.getElementById('maxPrice').addEventListener('change', load);
  document.getElementById('sortSelect').addEventListener('change', load);
  const q = qs('q');
  if (q) document.getElementById('pageTitle').textContent = `Results for "${q}"`;
  load();
}

function renderChips() {
  const active = qs('category');
  document.getElementById('categoryChips').innerHTML = ['all', ...categories.map(c => c.slug)].map(slug => {
    const label = slug === 'all' ? 'All' : categories.find(c => c.slug === slug).name;
    return `<button class="chip ${(!active && slug === 'all') || active === slug ? 'active' : ''}" data-slug="${slug}">${label}</button>`;
  }).join('');
  document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
    const url = new URL(window.location);
    if (chip.dataset.slug === 'all') url.searchParams.delete('category'); else url.searchParams.set('category', chip.dataset.slug);
    window.history.replaceState({}, '', url);
    renderChips();
    load();
  }));
}

async function load() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = Array.from({ length: 8 }).map(() => '<div class="skeleton" style="height:380px"></div>').join('');
  const params = new URLSearchParams();
  const category = qs('category'); if (category) params.set('category', category);
  const q = qs('q'); if (q) params.set('q', q);
  const min = document.getElementById('minPrice').value; if (min) params.set('min', min);
  const max = document.getElementById('maxPrice').value; if (max) params.set('max', max);
  const sort = document.getElementById('sortSelect').value; if (sort) params.set('sort', sort);
  const products = await api.get(`/products?${params}`);
  grid.innerHTML = products.length ? products.map(productCard).join('')
    : '<div class="empty-state"><p>No products match your filters.</p></div>';
  wireProductCards();
}

init();
</script>
</body>
</html>
