<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment | Anzala Chikankari</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="headerMount"></div>

<section class="section container">
  <h1 class="section-title" style="font-size:34px;">Book An Appointment</h1>
  <p class="section-sub">Custom stitching, bridal consultations & in-store visits at our Chowk boutique</p>

  <div class="booking-grid">
    <div>
      <h3 style="margin-top:0;">1. Choose a Service</h3>
      <div class="service-list" id="serviceList"></div>
    </div>

    <div>
      <h3 style="margin-top:0;">2. Pick a Date & Time</h3>
      <div class="calendar">
        <div class="cal-head">
          <button class="btn btn-ghost btn-sm" id="prevMonth">‹</button>
          <strong id="calLabel"></strong>
          <button class="btn btn-ghost btn-sm" id="nextMonth">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div id="slotBox" style="margin-top:20px;"></div>
    </div>
  </div>

  <div id="bookingForm" style="display:none;max-width:520px;margin:40px auto 0;background:#fff;border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08);">
    <h3 style="margin-top:0;">3. Your Details</h3>
    <form id="bookForm">
      <div class="form-row"><label>Full Name</label><input name="name" required></div>
      <div class="form-cols">
        <div class="form-row"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-row"><label>Phone</label><input name="phone" placeholder="10-digit mobile" required></div>
      </div>
      <div class="form-row"><label>Notes (optional)</label><textarea name="notes" rows="2" placeholder="Tell us what you're looking for…"></textarea></div>
      <p class="field-error" id="bookError"></p>
      <button class="btn btn-primary btn-block" type="submit">Confirm Appointment</button>
    </form>
  </div>

  <div id="bookSuccess" style="display:none;text-align:center;max-width:500px;margin:40px auto 0;">
    <div style="font-size:48px;">✅</div>
    <h2 class="serif">Appointment Booked!</h2>
    <p id="bookSuccessMsg" style="color:#6b6558;"></p>
    <a class="btn btn-dark" href="/account.html?tab=bookings">View My Bookings</a>
  </div>
</section>

<div id="footerMount"></div>
<script src="/js/app.js"></script>
<script>
let services = [];
let selectedService = null;
let cursor = new Date();
let selectedDate = null;
let selectedTime = null;

async function init() {
  await mountChrome('booking');
  services = await api.get('/services');
  document.getElementById('serviceList').innerHTML = services.map(s => `
    <div class="service-card" data-id="${s.id}">
      <h4>${esc(s.name)} ${s.price ? `· ${money(s.price)}` : '· Free'}</h4>
      <p>${esc(s.description)} (${s.duration_min} min)</p>
    </div>`).join('');
  document.querySelectorAll('.service-card').forEach(card => card.addEventListener('click', () => {
    document.querySelectorAll('.service-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    selectedService = Number(card.dataset.id);
    selectedTime = null;
    renderSlots();
  }));
  if (services[0]) { document.querySelector('.service-card').click(); }

  document.getElementById('prevMonth').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() - 1); renderCalendar(); });
  document.getElementById('nextMonth').addEventListener('click', () => { cursor.setMonth(cursor.getMonth() + 1); renderCalendar(); });
  renderCalendar();

  document.getElementById('bookForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const booking = await api.post('/bookings', {
        service_id: selectedService, date: selectedDate, time: selectedTime,
        name: f.get('name'), email: f.get('email'), phone: f.get('phone'), notes: f.get('notes'),
      });
      document.getElementById('bookingForm').style.display = 'none';
      document.getElementById('bookSuccess').style.display = 'block';
      document.getElementById('bookSuccessMsg').innerHTML =
        `Your appointment <strong>${esc(booking.booking_no)}</strong> for <strong>${esc(booking.service_name)}</strong> on
         <strong>${selectedDate} at ${selectedTime}</strong> is confirmed. We'll send a reminder to ${f.get('email')}.`;
    } catch (err) {
      document.getElementById('bookError').textContent = err.message;
      if (err.status === 409) renderSlots(); // slot may have just been taken — refresh
    }
  });
}

function renderCalendar() {
  const today = new Date(); today.setHours(0,0,0,0);
  const year = cursor.getFullYear(), month = cursor.getMonth();
  document.getElementById('calLabel').textContent = cursor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let html = ['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < firstDow; i++) html += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const iso = date.toISOString().slice(0, 10);
    const past = date < today;
    html += `<div class="cal-day ${past ? 'disabled' : ''} ${iso === selectedDate ? 'selected' : ''}" data-date="${iso}">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
  document.querySelectorAll('.cal-day:not(.disabled):not(.empty)').forEach(cell => cell.addEventListener('click', () => {
    selectedDate = cell.dataset.date;
    selectedTime = null;
    document.querySelectorAll('.cal-day').forEach(c => c.classList.remove('selected'));
    cell.classList.add('selected');
    renderSlots();
  }));
}

async function renderSlots() {
  const box = document.getElementById('slotBox');
  document.getElementById('bookingForm').style.display = 'none';
  if (!selectedDate || !selectedService) { box.innerHTML = ''; return; }
  box.innerHTML = '<p style="color:#999;font-size:13px;">Loading available times…</p>';
  const data = await api.get(`/bookings/slots?date=${selectedDate}&service_id=${selectedService}`);
  if (!data.open) { box.innerHTML = `<p class="msg-error">${data.reason}</p>`; return; }
  box.innerHTML = `<strong style="font-size:13px;">Available Times</strong><div class="slot-grid">
    ${data.slots.map(s => `<button class="slot-btn" data-time="${s.time}" ${s.available ? '' : 'disabled'}>${s.time}</button>`).join('')}
  </div>`;
  document.querySelectorAll('.slot-btn:not(:disabled)').forEach(btn => btn.addEventListener('click', () => {
    selectedTime = btn.dataset.time;
    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('bookingForm').style.display = 'block';
    if (Auth.user) {
      document.querySelector('[name=name]').value ||= Auth.user.name;
      document.querySelector('[name=email]').value ||= Auth.user.email;
      document.querySelector('[name=phone]').value ||= (Auth.user.phone || '');
    }
    document.getElementById('bookingForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
}

init();
</script>
</body>
</html>
