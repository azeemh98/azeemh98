<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Anzala Chikankari</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="headerMount"></div>

<section class="section container" id="checkoutRoot">
  <h1 class="section-title" style="font-size:32px;text-align:left;">Checkout</h1>
</section>

<div id="footerMount"></div>
<script src="/js/app.js"></script>
<script>
let quote = null;
let payMethod = 'cod';

async function init() {
  await mountChrome('shop');
  const items = Cart.read();
  if (!items.length) {
    document.getElementById('checkoutRoot').innerHTML += `<div class="empty-state"><p>Your bag is empty.</p><a class="btn btn-dark" href="/shop.html">Shop Now</a></div>`;
    return;
  }
  quote = await api.post('/cart/quote', { items, coupon: sessionStorage.getItem('anzala_coupon') || undefined });
  if (!quote.lines.length) {
    document.getElementById('checkoutRoot').innerHTML += `<div class="empty-state"><p>The items in your bag are no longer available.</p><a class="btn btn-dark" href="/shop.html">Shop Now</a></div>`;
    return;
  }
  renderForm();
}

function renderForm() {
  const u = Auth.user;
  document.getElementById('checkoutRoot').insertAdjacentHTML('beforeend', `
    <div class="checkout-grid">
      <div class="form-card">
        <h3 style="margin-top:0;">Delivery Details</h3>
        <form id="checkoutForm">
          <div class="form-row"><label>Full Name</label><input name="name" value="${esc(u?.name || '')}" required></div>
          <div class="form-cols">
            <div class="form-row"><label>Email</label><input type="email" name="email" value="${esc(u?.email || '')}" required></div>
            <div class="form-row"><label>Phone</label><input name="phone" value="${esc(u?.phone || '')}" placeholder="10-digit mobile" required></div>
          </div>
          <div class="form-row"><label>Address</label><textarea name="address" rows="2" required></textarea></div>
          <div class="form-cols">
            <div class="form-row"><label>City</label><input name="city" required></div>
            <div class="form-row"><label>State</label><input name="state" required></div>
          </div>
          <div class="form-row" style="max-width:200px;"><label>Pincode</label><input name="pincode" maxlength="6" required></div>
          <div class="form-row"><label>Order Notes (optional)</label><textarea name="notes" rows="2" placeholder="e.g. gift wrap, delivery instructions"></textarea></div>

          <h3>Payment Method</h3>
          <div class="pay-options">
            <div class="pay-option active" data-method="cod"><strong>💵 Cash on Delivery</strong><p style="font-size:12px;color:#999;margin:6px 0 0;">Pay when it arrives</p></div>
            <div class="pay-option" data-method="upi"><strong>📱 UPI</strong><p style="font-size:12px;color:#999;margin:6px 0 0;">Pay via ${esc(SETTINGS.upi_id)}</p></div>
          </div>
          <div id="upiBox" style="display:none;background:#fdf9f0;border-radius:8px;padding:16px;margin-bottom:16px;font-size:13px;">
            Please pay <strong>${money(quote.total)}</strong> to UPI ID <strong>${esc(SETTINGS.upi_id)}</strong> and mention your name in the note. Our team will confirm your payment before dispatch.
          </div>
          <p class="field-error" id="checkoutError"></p>
          <button class="btn btn-primary btn-block" type="submit" id="placeOrderBtn">Place Order — ${money(quote.total)}</button>
        </form>
      </div>
      <div class="summary-card">
        <h3 style="margin-top:0;">Order Summary</h3>
        ${quote.lines.map(l => `
          <div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eee;">
            <img src="${esc(l.image || '')}" style="width:52px;height:66px;object-fit:cover;border-radius:6px;">
            <div style="flex:1;font-size:13px;">
              <div>${esc(l.name)}</div>
              <div style="color:#999;">${l.size ? `Size ${l.size} · ` : ''}Qty ${l.qty}</div>
            </div>
            <div style="font-size:13px;font-weight:600;">${money(l.line_total)}</div>
          </div>`).join('')}
        <div class="summary-row" style="margin-top:14px;"><span>Subtotal</span><span>${money(quote.subtotal)}</span></div>
        ${quote.discount ? `<div class="summary-row"><span>Discount (${quote.coupon.code})</span><span>−${money(quote.discount)}</span></div>` : ''}
        <div class="summary-row"><span>Shipping</span><span>${quote.shipping ? money(quote.shipping) : 'FREE'}</span></div>
        <div class="summary-row total"><span>Total</span><span>${money(quote.total)}</span></div>
      </div>
    </div>`);

  document.querySelectorAll('.pay-option').forEach(opt => opt.addEventListener('click', () => {
    document.querySelectorAll('.pay-option').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    payMethod = opt.dataset.method;
    document.getElementById('upiBox').style.display = payMethod === 'upi' ? 'block' : 'none';
  }));

  document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = document.getElementById('placeOrderBtn');
    btn.disabled = true; btn.textContent = 'Placing order…';
    try {
      const order = await api.post('/orders', {
        name: f.get('name'), email: f.get('email'), phone: f.get('phone'), address: f.get('address'),
        city: f.get('city'), state: f.get('state'), pincode: f.get('pincode'), notes: f.get('notes'),
        payment_method: payMethod, items: Cart.read(), coupon: quote.coupon?.code, expected_total: quote.total,
      });
      Cart.clear();
      sessionStorage.removeItem('anzala_coupon');
      window.location.href = `/order-success.html?order=${order.order_no}`;
    } catch (err) {
      document.getElementById('checkoutError').textContent = err.message;
      btn.disabled = false; btn.textContent = `Place Order — ${money(quote.total)}`;
    }
  });
}

init();
</script>
</body>
</html>
