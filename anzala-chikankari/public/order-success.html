<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | Anzala Chikankari</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="headerMount"></div>
<section class="section container" style="text-align:center;max-width:560px;">
  <div style="font-size:56px;">🎉</div>
  <h1 class="serif" style="font-size:32px;">Thank You For Your Order!</h1>
  <p id="orderMsg" style="color:#6b6558;"></p>
  <div style="display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap;">
    <a class="btn btn-dark" id="trackLink" href="#">Track This Order</a>
    <a class="btn btn-outline" href="/shop.html">Continue Shopping</a>
  </div>
</section>
<div id="footerMount"></div>
<script src="/js/app.js"></script>
<script>
async function init() {
  await mountChrome('shop');
  const orderNo = qs('order');
  document.getElementById('orderMsg').innerHTML = orderNo
    ? `Your order <strong>${orderNo}</strong> has been placed successfully. We've sent a confirmation to your email and will keep you posted as it's packed and shipped.`
    : `Your order has been placed successfully.`;
  document.getElementById('trackLink').href = orderNo ? `/account.html?tab=orders&order=${orderNo}` : '/account.html?tab=orders';
}
init();
</script>
</body>
</html>
