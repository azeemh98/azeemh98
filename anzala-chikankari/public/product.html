<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Anzala Chikankari</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="headerMount"></div>

<section class="section container" id="pdpRoot">
  <p style="color:#999">Loading…</p>
</section>

<section class="section container" id="relatedSection" style="display:none">
  <h2 class="section-title">You May Also Like</h2>
  <div class="product-grid" id="relatedGrid"></div>
</section>

<div id="footerMount"></div>
<script src="/js/app.js"></script>
<script>
let product = null;
let selectedSize = null;
let qty = 1;

async function init() {
  await mountChrome('shop');
  const slug = qs('slug');
  try {
    product = await api.get(`/products/${slug}`);
  } catch (e) {
    document.getElementById('pdpRoot').innerHTML = `<div class="empty-state"><p>${e.message}</p><a class="btn btn-dark" href="/shop.html">Back to Shop</a></div>`;
    return;
  }
  selectedSize = product.sizes[0] || null;
  render();
  if (product.related.length) {
    document.getElementById('relatedSection').style.display = 'block';
    document.getElementById('relatedGrid').innerHTML = product.related.map(productCard).join('');
    wireProductCards();
  }
}

function render() {
  const p = product;
  document.title = `${p.name} | Anzala Chikankari`;
  document.getElementById('pdpRoot').innerHTML = `
    <div class="pdp">
      <div class="pdp-gallery">
        <div class="pdp-main-img"><img id="mainImg" src="${esc(p.images[0] || '')}" alt="${esc(p.name)}"></div>
        ${p.images.length > 1 ? `<div class="pdp-thumbs">${p.images.map((img, i) => `<img src="${esc(img)}" class="${i === 0 ? 'active' : ''}" data-i="${i}">`).join('')}</div>` : ''}
      </div>
      <div class="pdp-info">
        <p style="color:#b08b32;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;">${esc(p.category_name || '')}</p>
        <h1>${esc(p.name)}</h1>
        ${p.rating ? `<div class="rating-row">${starRow(p.rating)} ${p.rating} · ${p.review_count} review${p.review_count === 1 ? '' : 's'}</div>` : '<p style="color:#999;font-size:13px;">No reviews yet</p>'}
        <div class="pdp-price">${money(p.price)} ${p.compare_price ? `<span class="price-compare">${money(p.compare_price)}</span>` : ''}</div>
        <p style="color:#6b6558;font-size:14px;line-height:1.7;">${esc(p.description)}</p>

        ${p.sizes.length ? `<div id="size"><strong style="font-size:13px;">Size</strong><div class="size-row" id="sizeRow">
          ${p.sizes.map(s => `<button class="size-btn ${s === selectedSize ? 'active' : ''}" data-size="${esc(s)}">${esc(s)}</button>`).join('')}
        </div></div>` : ''}

        <div class="qty-row">
          <strong style="font-size:13px;">Quantity</strong>
          <div class="qty-control">
            <button id="qtyDec">−</button><span id="qtyVal">1</span><button id="qtyInc">+</button>
          </div>
          <span style="font-size:12px;color:#999;">${p.stock > 0 ? `${p.stock} in stock` : 'Out of stock'}</span>
        </div>

        <div class="pdp-actions">
          <button class="btn btn-dark" style="flex:1" id="addBtn" ${p.stock === 0 ? 'disabled' : ''}>${p.stock === 0 ? 'Sold Out' : 'Add To Bag'}</button>
          <button class="btn btn-outline" id="wishBtn" data-wish="${p.id}">♡ Wishlist</button>
        </div>

        <div class="pdp-meta">
          <p><strong>Fabric:</strong> ${esc(p.fabric || '—')}</p>
          <p><strong>Care:</strong> Dry clean recommended to preserve hand embroidery.</p>
          <p><strong>Delivery:</strong> Ships in 2–4 business days. Free shipping over ${money(SETTINGS.free_shipping_min)}.</p>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="reviews">Reviews (${p.reviews.length})</div>
    </div>
    <div id="reviewsPanel">
      ${Auth.user ? `
      <div class="review-form" style="margin-bottom:30px;max-width:500px;">
        <div class="star-picker" id="starPicker">${[1,2,3,4,5].map(n => `<span data-n="${n}">★</span>`).join('')}</div>
        <textarea id="reviewText" placeholder="Share your experience with this product…"></textarea>
        <button class="btn btn-dark btn-sm" id="submitReview" style="margin-top:10px;">Submit Review</button>
      </div>` : `<p style="font-size:13px;color:#999;margin-bottom:20px;"><a href="#" onclick="openAuthModal();return false;">Log in</a> to write a review.</p>`}
      ${p.reviews.length ? p.reviews.map(r => `
        <div class="review-item">
          <strong>${esc(r.name)}</strong> ${r.verified ? '<span class="verified">✓ Verified Purchase</span>' : ''}
          <div>${starRow(r.rating)}</div>
          <p style="font-size:14px;margin:6px 0 0;">${esc(r.comment || '')}</p>
        </div>`).join('') : '<p style="color:#999;font-size:14px;">Be the first to review this product.</p>'}
    </div>`;

  wireInteractions();
}

function wireInteractions() {
  document.querySelectorAll('.pdp-thumbs img').forEach(img => img.addEventListener('click', () => {
    document.getElementById('mainImg').src = img.src;
    document.querySelectorAll('.pdp-thumbs img').forEach(i => i.classList.remove('active'));
    img.classList.add('active');
  }));
  document.querySelectorAll('.size-btn').forEach(btn => btn.addEventListener('click', () => {
    selectedSize = btn.dataset.size;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }));
  document.getElementById('qtyInc')?.addEventListener('click', () => { qty = Math.min(10, qty + 1); document.getElementById('qtyVal').textContent = qty; });
  document.getElementById('qtyDec')?.addEventListener('click', () => { qty = Math.max(1, qty - 1); document.getElementById('qtyVal').textContent = qty; });
  document.getElementById('addBtn')?.addEventListener('click', () => {
    if (product.sizes.length && !selectedSize) return toast('Please select a size', true);
    Cart.add(product.id, selectedSize, qty);
    toast('Added to your bag');
  });

  const wishBtn = document.getElementById('wishBtn');
  Wishlist.list().then(ids => {
    if (ids.includes(product.id)) { wishBtn.classList.add('active'); wishBtn.textContent = '♥ Wishlisted'; }
  });
  wishBtn?.addEventListener('click', async () => {
    await Wishlist.toggle(product.id);
    wishBtn.classList.toggle('active');
    wishBtn.textContent = wishBtn.classList.contains('active') ? '♥ Wishlisted' : '♡ Wishlist';
  });

  let chosenRating = 5;
  document.querySelectorAll('#starPicker span').forEach(s => s.addEventListener('click', () => {
    chosenRating = Number(s.dataset.n);
    document.querySelectorAll('#starPicker span').forEach(x => x.classList.toggle('on', Number(x.dataset.n) <= chosenRating));
  }));
  document.querySelectorAll('#starPicker span').forEach(x => x.classList.toggle('on', Number(x.dataset.n) <= chosenRating));
  document.getElementById('submitReview')?.addEventListener('click', async () => {
    try {
      await api.post(`/products/${product.id}/reviews`, { rating: chosenRating, comment: document.getElementById('reviewText').value });
      toast('Thank you for your review!');
      product = await api.get(`/products/${qs('slug')}`);
      render();
    } catch (e) { toast(e.message, true); }
  });
}

init();
</script>
</body>
</html>
