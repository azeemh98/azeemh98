<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Anzala Chikankari</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="headerMount"></div>
<section class="section container">
  <h1 class="section-title" style="font-size:34px;">Get In Touch</h1>
  <div class="checkout-grid">
    <div class="form-card">
      <form id="contactForm">
        <div class="form-row"><label>Name</label><input name="name" required></div>
        <div class="form-cols">
          <div class="form-row"><label>Email</label><input type="email" name="email" required></div>
          <div class="form-row"><label>Phone (optional)</label><input name="phone"></div>
        </div>
        <div class="form-row"><label>Message</label><textarea name="message" rows="5" required></textarea></div>
        <p class="field-error" id="contactError"></p>
        <p class="msg-success" id="contactSuccess" style="display:none;">Thanks! We'll get back to you within 24 hours.</p>
        <button class="btn btn-primary" type="submit">Send Message</button>
      </form>
    </div>
    <div class="summary-card">
      <h3 style="margin-top:0;">Visit Our Boutique</h3>
      <p id="addr" style="font-size:14px;color:#6b6558;line-height:1.8;"></p>
      <p style="font-size:14px;"><strong>Email:</strong> <span id="cEmail"></span></p>
      <p style="font-size:14px;"><strong>Phone:</strong> <span id="cPhone"></span></p>
      <a class="btn btn-outline btn-block" id="waLink" href="#" target="_blank" rel="noopener" style="margin-top:14px;">Chat on WhatsApp</a>
    </div>
  </div>
</section>
<div id="footerMount"></div>
<script src="/js/app.js"></script>
<script>
async function init() {
  await mountChrome('contact');
  document.getElementById('addr').textContent = SETTINGS.store_address;
  document.getElementById('cEmail').textContent = SETTINGS.store_email;
  document.getElementById('cPhone').textContent = SETTINGS.store_phone;
  document.getElementById('waLink').href = `https://wa.me/${SETTINGS.whatsapp}`;

  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await api.post('/contact', { name: f.get('name'), email: f.get('email'), phone: f.get('phone'), message: f.get('message') });
      document.getElementById('contactSuccess').style.display = 'block';
      document.getElementById('contactError').textContent = '';
      e.target.reset();
    } catch (err) { document.getElementById('contactError').textContent = err.message; }
  });
}
init();
</script>
</body>
</html>
